<div class="ingredient-row">
  <input
    type="text"
    class="ingredient-name"
    [value]="ingredient.name"
    (input)="onNameChange($any($event.target).value)"
    [readonly]="isFlourRow"
    [class.readonly]="isFlourRow"
  />

  <input
    type="number"
    class="ingredient-percentage"
    [value]="ingredient.percentage"
    (input)="onPercentageChange($any($event.target).value)"
    [readonly]="isFlourRow || !isPercentageEditable"
    [class.readonly]="isFlourRow || !isPercentageEditable"
    [class.locked]="!isPercentageEditable && !isFlourRow"
    min="0"
    step="0.1"
  />
  <span class="unit">%</span>

  <input
    type="number"
    class="ingredient-weight"
    [value]="ingredient.weight"
    (input)="onWeightChange($any($event.target).value)"
    min="0"
    step="1"
  />
  <span class="unit">g</span>

  <button
    *ngIf="!isFlourRow"
    class="remove-btn"
    (click)="onRemove()"
    aria-label="Remove ingredient"
  >
    ×
  </button>
</div>
